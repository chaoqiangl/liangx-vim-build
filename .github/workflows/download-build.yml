
name: Build Liangx Download Tools DEBs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/download-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Download Tools for com.liangx
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Runner information
      # ============================================================

      - name: Check runner resources
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SYSTEM ====="
          uname -a
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== DISK ====="
          df -h /

      # ============================================================
      # 2. Checkout pinned Termux packages source
      # ============================================================

      - name: Checkout official Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: e0ce77d242bb9f9adb48cc38dca4d69b3b6d0af9
          path: termux-packages

      # ============================================================
      # 3. Configure com.liangx package identity
      # ============================================================

      - name: Configure package identity
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/^TERMUX_APP__PACKAGE_NAME="com\.termux"$/TERMUX_APP__PACKAGE_NAME="com.liangx"/' \
            scripts/properties.sh

          grep -q '^TERMUX_APP__PACKAGE_NAME="com.liangx"$' \
            scripts/properties.sh

          echo "===== PACKAGE IDENTITY ====="
          grep '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

      # ============================================================
      # 4. Switch foot to Debian source mirror
      # ============================================================

      - name: Switch foot to Debian source mirror
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          FILE="x11-packages/foot/build.sh"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: foot recipe not found: $FILE"
            exit 1
          fi

          echo "===== ORIGINAL FOOT RECIPE ====="
          cat "$FILE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/foot/build.sh")
          content = path.read_text()

          if not re.search(
              r'^TERMUX_PKG_VERSION="1\.28\.0"$',
              content,
              re.MULTILINE
          ):
              raise SystemExit("ERROR: Unexpected foot version")

          source_pattern = (
              r'^TERMUX_PKG_SRCURL=.*codeberg\.org/dnkl/foot.*$'
          )

          content, source_count = re.subn(
              source_pattern,
              'TERMUX_PKG_SRCURL="https://deb.debian.org/debian/pool/main/f/foot/foot_${TERMUX_PKG_VERSION}.orig.tar.xz"',
              content,
              flags=re.MULTILINE
          )

          if source_count != 1:
              raise SystemExit(
                  f"ERROR: Expected one Codeberg source URL, found {source_count}"
              )

          checksum_pattern = r'^TERMUX_PKG_SHA256=.*$'

          content, checksum_count = re.subn(
              checksum_pattern,
              'TERMUX_PKG_SHA256=17621ad2e38a83688202117599857212a65434ae0562752a38167537a6c35cbd',
              content,
              flags=re.MULTILINE
          )

          if checksum_count != 1:
              raise SystemExit(
                  f"ERROR: Expected one SHA256 entry, found {checksum_count}"
              )

          path.write_text(content)

          print("OK: foot source URL switched")
          print("OK: foot SHA256 updated")
          PY

          echo
          echo "===== UPDATED FOOT SOURCE ====="

          grep -E \
            '^(TERMUX_PKG_VERSION|TERMUX_PKG_SRCURL|TERMUX_PKG_SHA256)=' \
            "$FILE"

          if grep -nE \
            '^TERMUX_PKG_SRCURL=.*codeberg\.org/dnkl/foot' \
            "$FILE"; then
            echo "ERROR: Codeberg source URL still exists"
            exit 1
          fi

          echo "OK: foot build recipe uses Debian source mirror"

      # ============================================================
      # 5. Verify foot source archive and SHA256
      # ============================================================

      - name: Verify foot Debian source mirror
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/foot_1.28.0.orig.tar.xz"
          URL="https://deb.debian.org/debian/pool/main/f/foot/foot_1.28.0.orig.tar.xz"
          EXPECTED_SHA256="17621ad2e38a83688202117599857212a65434ae0562752a38167537a6c35cbd"

          echo "===== DOWNLOAD FOOT SOURCE ====="

          curl -fL --retry 3 --retry-delay 5 \
            "$URL" -o "$ARCHIVE"

          echo
          echo "===== SHA256 VERIFICATION ====="

          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c -

          echo
          echo "===== ARCHIVE CONTENTS CHECK ====="

          tar -tJf "$ARCHIVE" > "$RUNNER_TEMP/foot-archive-list.txt"

          if ! grep -q '^foot-1\.28\.0/$' \
            "$RUNNER_TEMP/foot-archive-list.txt"; then
            echo "ERROR: Unexpected archive root directory"
            exit 1
          fi

          echo "OK: foot-1.28.0 archive structure verified"

          echo
          echo "===== ARCHIVE CONTENTS PREVIEW ====="
          sed -n '1,20p' "$RUNNER_TEMP/foot-archive-list.txt"

      # ============================================================
      # 6. Fix ncurses foot.info lookup
      # ============================================================

      - name: Fix ncurses foot terminfo source path
        shell: bash
        run: |
          set -euo pipefail

          FILE="termux-packages/packages/ncurses/build.sh"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: ncurses build.sh not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()

          old = """\tsed 's/@default_terminfo@/foot/g' "$TERMUX_PKG_SRCDIR/foot/foot.info" | \\"""

          new = """\tlocal FOOT_INFO
          \tFOOT_INFO="$(find "$TERMUX_PKG_SRCDIR" -type f -name foot.info -print -quit)"

          \tif [[ -z "$FOOT_INFO" ]]; then
          \t\ttermux_error_exit "Could not locate foot.info under $TERMUX_PKG_SRCDIR"
          \tfi

          \tsed 's/@default_terminfo@/foot/g' "$FOOT_INFO" | \\"""

          count = content.count(old)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one original foot terminfo command, found {count}"
              )

          path.write_text(content.replace(old, new, 1))

          print("OK: ncurses foot terminfo lookup patched")
          PY

          echo "===== UPDATED NCURSES FOOT SECTION ====="
          grep -n -B5 -A8 'FOOT_INFO' "$FILE"

          echo
          echo "===== VERIFY ORIGINAL PATH REMOVED ====="

          if grep -n -F \
            '"$TERMUX_PKG_SRCDIR/foot/foot.info"' \
            "$FILE"; then
            echo "ERROR: Original hardcoded path still exists"
            exit 1
          fi

          echo "OK: Original hardcoded path removed"

      # ============================================================
      # 7. Install Ubuntu build environment
      # ============================================================

      - name: Install Ubuntu build environment
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup-ubuntu.sh

      # ============================================================
      # 8. Install Android SDK and NDK
      # ============================================================

      - name: Install Android SDK and NDK
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup-android-sdk.sh

      # ============================================================
      # 9. Verify source and all target recipes
      # ============================================================

      - name: Verify source and build recipes
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD

          EXPECTED_COMMIT="e0ce77d242bb9f9adb48cc38dca4d69b3b6d0af9"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Unexpected Termux source commit"
            exit 1
          fi

          echo
          echo "===== PACKAGE IDENTITY ====="
          grep '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

          echo
          echo "===== FOOT SOURCE ====="

          grep -E \
            '^(TERMUX_PKG_VERSION|TERMUX_PKG_SRCURL|TERMUX_PKG_SHA256)=' \
            x11-packages/foot/build.sh

          echo
          echo "===== BUILD TARGET RECIPES ====="

          for package in \
            rclone \
            python-yt-dlp \
            wget2 \
            gpgme \
            python-brotli \
            python-pycryptodomex
          do
            if [ ! -f "packages/$package/build.sh" ]; then
              echo "ERROR: Missing recipe: packages/$package/build.sh"
              exit 1
            fi

            echo "OK: $package"
          done

          echo
          echo "===== DISK BEFORE BUILD ====="
          df -h /

      # ============================================================
      # 10. Build all targets and recursive dependencies
      # ============================================================

      - name: Build download tools and all dependencies
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          # Use the official default output directory.
          # Recursive dependency builds inherit this exported variable.
          export TERMUX_OUTPUT_DIR="$GITHUB_WORKSPACE/termux-packages/output"

          # Do not reuse old DEBs from previous builds.
          rm -rf "$TERMUX_OUTPUT_DIR"
          mkdir -p "$TERMUX_OUTPUT_DIR"

          echo "===== OUTPUT DIRECTORY ====="
          echo "$TERMUX_OUTPUT_DIR"

          echo
          echo "===== BUILD TARGETS ====="

          TARGETS=(
            rclone
            python-yt-dlp
            wget2
            gpgme
            python-brotli
            python-pycryptodomex
          )

          printf '%s\n' "${TARGETS[@]}"

          echo
          echo "===== ARCHITECTURE ====="
          echo "aarch64"

          echo
          echo "===== PREFIX ====="
          echo "/data/data/com.liangx/files/usr"

          echo
          echo "===== BUILD MODE ====="
          echo "Force build targets and dependencies (-F)"

          # -F forces rebuilding packages and their dependencies.
          # No -o option: all recursive builds use TERMUX_OUTPUT_DIR.
          ./build-package.sh \
            -a aarch64 \
            -j2 \
            -F \
            "${TARGETS[@]}"

          echo
          echo "===== BUILD FINISHED ====="
          find "$TERMUX_OUTPUT_DIR" -type f -name '*.deb' -print | sort

          echo
          echo "===== DISK AFTER BUILD ====="
          df -h /

      # ============================================================
      # 11. Verify generated DEBs and create manifests
      # ============================================================

      - name: Verify generated DEB packages
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          OUT="$GITHUB_WORKSPACE/termux-packages/output"
          DEBS=("$OUT"/*.deb)

          if [ "${#DEBS[@]}" -eq 0 ]; then
            echo "ERROR: No DEB packages were generated"
            exit 1
          fi

          MANIFEST="$OUT/PACKAGE-MANIFEST.txt"
          : > "$MANIFEST"

          echo "===== GENERATED PACKAGES ====="

          for deb in "${DEBS[@]}"
          do
            package="$(dpkg-deb -f "$deb" Package)"
            version="$(dpkg-deb -f "$deb" Version)"
            architecture="$(dpkg-deb -f "$deb" Architecture)"

            printf '%-32s %-25s %s\n' \
              "$package" "$version" "$architecture"

            printf '%s %s %s\n' \
              "$package" "$version" "$architecture" \
              >> "$MANIFEST"

            if [ "$architecture" != "aarch64" ] && \
               [ "$architecture" != "all" ]; then
              echo "ERROR: Unexpected architecture: $architecture"
              exit 1
            fi
          done

          echo
          echo "===== REQUIRED TARGETS ====="

          for required in \
            rclone \
            python-yt-dlp \
            wget2 \
            gpgme \
            python-brotli \
            python-pycryptodomex
          do
            if ! awk -v p="$required" \
              '$1 == p { found=1 } END { exit !found }' \
              "$MANIFEST"; then
              echo "ERROR: Required package missing: $required"
              exit 1
            fi

            echo "OK: $required"
          done

          echo
          echo "===== PACKAGE COUNT ====="
          echo "DEB count: ${#DEBS[@]}"

          echo
          echo "===== OUTPUT SIZE ====="
          du -sh "$OUT"

      # ============================================================
      # 12. Verify recursive runtime dependency closure
      # ============================================================

      - name: Verify runtime dependency closure
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/termux-packages/output"

          python3 - "$OUT" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          out = pathlib.Path(sys.argv[1])
          debs = sorted(out.glob("*.deb"))

          if not debs:
              raise SystemExit("ERROR: No DEB files found")

          # Only add packages here when they are guaranteed to exist
          # in every supported com.liangx base installation.
          #
          # Leave empty by default: unresolved dependencies must be
          # delivered as DEBs rather than silently ignored.
          BASE_PACKAGES = set()

          packages = {}
          provides = {}

          def field(deb, name):
              result = subprocess.run(
                  ["dpkg-deb", "-f", str(deb), name],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL
              )
              if result.returncode != 0:
                  return ""
              return result.stdout.strip()

          def split_top(text, separator):
              result = []
              start = 0
              depth = 0

              for i, char in enumerate(text):
                  if char in "([":
                      depth += 1
                  elif char in ")]":
                      depth = max(0, depth - 1)
                  elif char == separator and depth == 0:
                      result.append(text[start:i].strip())
                      start = i + 1

              result.append(text[start:].strip())
              return [x for x in result if x]

          def parse_atom(atom):
              atom = re.sub(r"\[[^\]]*\]", "", atom)
              atom = re.sub(r"<[^>]*>", "", atom)

              match = re.match(
                  r"\s*([a-z0-9][a-z0-9+.-]*)"
                  r"(?::[a-z0-9-]+)?"
                  r"\s*(?:\(\s*(<<|<=|=|>=|>>)\s*([^)]+)\))?",
                  atom
              )

              if not match:
                  return None

              return (
                  match.group(1),
                  match.group(2),
                  match.group(3).strip() if match.group(3) else None
              )

          def version_ok(actual, operator, required):
              if not operator:
                  return True

              return subprocess.run(
                  ["dpkg", "--compare-versions", actual, operator, required],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              ).returncode == 0

          # Read all package metadata.
          for deb in debs:
              name = field(deb, "Package")
              version = field(deb, "Version")
              arch = field(deb, "Architecture")

              if not name or not version:
                  raise SystemExit(f"ERROR: Invalid DEB metadata: {deb}")

              if name in packages:
                  raise SystemExit(
                      f"ERROR: Duplicate package name in output: {name}"
                  )

              packages[name] = {
                  "version": version,
                  "architecture": arch,
                  "deb": deb,
              }

          # Read Provides fields, including versioned Provides.
          for name, info in packages.items():
              raw = field(info["deb"], "Provides")

              for item in split_top(raw, ","):
                  parsed = parse_atom(item)

                  if not parsed:
                      continue

                  virtual_name, operator, virtual_version = parsed

                  provides.setdefault(virtual_name, []).append({
                      "package": name,
                      "version": virtual_version or info["version"],
                      "operator": operator,
                  })

          def candidate_satisfies(atom):
              parsed = parse_atom(atom)

              if not parsed:
                  return False

              name, operator, required_version = parsed

              if name in BASE_PACKAGES:
                  return True

              candidates = []

              if name in packages:
                  candidates.append({
                      "version": packages[name]["version"],
                      "operator": None,
                  })

              candidates.extend(provides.get(name, []))

              for candidate in candidates:
                  if not operator:
                      return True

                  candidate_version = candidate["version"]

                  if candidate["operator"] == "=":
                      if version_ok(
                          candidate_version,
                          operator,
                          required_version
                      ):
                          return True
                  elif candidate["operator"] is None:
                      if version_ok(
                          candidate_version,
                          operator,
                          required_version
                      ):
                          return True

              return False

          dependency_report = []
          missing = []

          print("===== RUNTIME DEPENDENCY AUDIT =====")

          for package_name, info in sorted(packages.items()):
              depends = field(info["deb"], "Depends")
              pre_depends = field(info["deb"], "Pre-Depends")

              combined = []

              if pre_depends:
                  combined.append(("Pre-Depends", pre_depends))

              if depends:
                  combined.append(("Depends", depends))

              for field_name, expression in combined:
                  for group in split_top(expression, ","):
                      alternatives = split_top(group, "|")

                      if any(
                          candidate_satisfies(atom)
                          for atom in alternatives
                      ):
                          selected = " | ".join(alternatives)
                          dependency_report.append(
                              f"{package_name}: {field_name}: "
                              f"{selected} [OK]"
                          )
                      else:
                          selected = " | ".join(alternatives)

                          message = (
                              f"{package_name}: {field_name}: "
                              f"{selected} [MISSING]"
                          )

                          missing.append(message)
                          dependency_report.append(message)

          report_file = out / "DEPENDENCY-CLOSURE.txt"
          report_file.write_text(
              "\n".join(dependency_report) + "\n"
          )

          print("\n".join(dependency_report))

          print()
          print("===== DEPENDENCY AUDIT SUMMARY =====")
          print(f"DEB packages: {len(packages)}")
          print(f"Dependency entries: {len(dependency_report)}")
          print(f"Unresolved dependencies: {len(missing)}")

          if missing:
              print()
              print("ERROR: Runtime dependency closure is incomplete.")
              print("The following dependencies are not present:")
              print("\n".join(missing))
              raise SystemExit(1)

          print("OK: All Depends and Pre-Depends are satisfied.")
          PY

      # ============================================================
      # 13. Generate SHA256 checksums
      # ============================================================

      - name: Generate SHA256 checksums
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/termux-packages/output"

          cd "$OUT"

          find . -maxdepth 1 -type f -name '*.deb' \
            -printf '%f\n' \
            | sort \
            | while IFS= read -r file
              do
                sha256sum "$file"
              done > SHA256SUMS.txt

          echo "===== SHA256SUMS ====="
          cat SHA256SUMS.txt

          echo
          echo "===== FINAL OUTPUT CONTENTS ====="
          find . -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "===== FINAL OUTPUT SIZE ====="
          du -sh .

      # ============================================================
      # 14. Upload the entire output directory
      # ============================================================

      - name: Upload all AArch64 DEBs and manifests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: liangx-download-aarch64-debs
          path: termux-packages/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
