
name: Build Liangx Vim DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vim-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Vim and Complete Dependencies for com.liangx
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      # 1. 检查 Runner 资源
      - name: Check runner resources
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SYSTEM ====="
          uname -a
          nproc

          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h /

      # 2. 获取固定版本的 Termux 源码
      - name: Checkout official Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: e0ce77d242bb9f9adb48cc38dca4d69b3b6d0af9
          path: termux-packages

      # 3. 修改安装包身份
      - name: Configure package identity
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ORIGINAL CONFIGURATION ====="
          grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

          sed -i \
            's/^TERMUX_APP__PACKAGE_NAME="com\.termux"$/TERMUX_APP__PACKAGE_NAME="com.liangx"/' \
            scripts/properties.sh

          echo "===== MODIFIED CONFIGURATION ====="
          grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

          grep -q '^TERMUX_APP__PACKAGE_NAME="com.liangx"$' \
            scripts/properties.sh

          echo "===== REPOSITORY IDENTITY ====="
          grep -n '^TERMUX_REPO_APP__PACKAGE_NAME=' scripts/properties.sh || true

      # 4. 安装 Ubuntu 构建环境
      - name: Install Ubuntu build environment
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup-ubuntu.sh

      # 5. 安装 Android SDK 和 NDK
      - name: Install Android SDK and NDK
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup-android-sdk.sh

      # 6. 检查构建环境
      - name: Verify build environment
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD

          echo "===== PACKAGE IDENTITY ====="
          grep '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

          echo "===== NDK ====="
          find "$HOME" -path '*/source.properties' \
            -print -exec grep -E '^(Pkg.Revision|Pkg.ReleaseName)' {} \; \
            2>/dev/null | head -30

          echo "===== BUILD TOOL ====="
          ./build-package.sh --help || true

          echo "===== DISK BEFORE BUILD ====="
          df -h /

      # 7. 解析完整依赖清单
      - name: Generate complete dependency build list
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          echo "===== WORKING DIRECTORY ====="
          pwd

          echo "===== RESOLVE VIM DEPENDENCIES ====="
          python3 scripts/buildorder.py \
            -i packages/vim packages \
            > "$GITHUB_WORKSPACE/vim-build-order.txt"

          echo "===== RESOLVE DIFFUTILS DEPENDENCIES ====="
          python3 scripts/buildorder.py \
            -i packages/diffutils packages \
            > "$GITHUB_WORKSPACE/diffutils-build-order.txt"

          echo "===== GENERATE BUILD TARGETS ====="

          python3 - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])

          order_files = [
              workspace / "vim-build-order.txt",
              workspace / "diffutils-build-order.txt",
          ]

          root_targets = {"vim", "diffutils"}

          build_targets = []
          seen_targets = set()
          expected_packages = set()

          for order_file in order_files:
              if not order_file.is_file():
                  raise SystemExit(
                      f"ERROR: Missing build order file: {order_file}"
                  )

              with order_file.open(encoding="utf-8") as f:
                  for line in f:
                      fields = line.split()

                      if len(fields) < 2:
                          continue

                      # buildorder.py output:
                      # package_name package_directory
                      package_name = fields[0]
                      package_dir = fields[-1].rstrip("/")

                      # Record the actual package name.
                      expected_packages.add(package_name)

                      # Subpackages share the parent build directory.
                      # Do not test directory existence here:
                      # the buildorder output path is used as an identifier.
                      target = package_dir.split("/")[-1]

                      if not target:
                          raise SystemExit(
                              f"ERROR: Invalid package directory field: {line!r}"
                          )

                      if target not in root_targets:
                          if target not in seen_targets:
                              seen_targets.add(target)
                              build_targets.append(target)

          # Add the requested root packages.
          for target in ("vim", "diffutils"):
              if target not in seen_targets:
                  seen_targets.add(target)
                  build_targets.append(target)

              expected_packages.add(target)

          # xxd is generated as a Vim subpackage.
          expected_packages.add("xxd")

          if not build_targets:
              raise SystemExit("ERROR: Empty build target list")

          with (workspace / "build-targets.txt").open(
              "w", encoding="utf-8"
          ) as f:
              f.write("\n".join(build_targets) + "\n")

          with (workspace / "expected-packages.txt").open(
              "w", encoding="utf-8"
          ) as f:
              f.write("\n".join(sorted(expected_packages)) + "\n")

          print("===== BUILD TARGETS =====")
          for target in build_targets:
              print(target)

          print(f"Total build targets: {len(build_targets)}")

          print()
          print("===== EXPECTED PACKAGES =====")
          for package in sorted(expected_packages):
              print(package)

          print(f"Total expected packages: {len(expected_packages)}")
          PY

          echo "===== BUILD ORDER FILES ====="
          wc -l \
            "$GITHUB_WORKSPACE/vim-build-order.txt" \
            "$GITHUB_WORKSPACE/diffutils-build-order.txt"

          echo "===== BUILD TARGET COUNT ====="
          wc -l "$GITHUB_WORKSPACE/build-targets.txt"

          echo "===== EXPECTED PACKAGE COUNT ====="
          wc -l "$GITHUB_WORKSPACE/expected-packages.txt"

      # 8. 构建全部依赖及目标包
      - name: Build Vim and all dependencies
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/debs"

          mapfile -t BUILD_TARGETS \
            < "$GITHUB_WORKSPACE/build-targets.txt"

          if [ "${#BUILD_TARGETS[@]}" -eq 0 ]; then
            echo "ERROR: Build target list is empty."
            exit 1
          fi

          echo "===== BUILD TARGETS ====="
          printf '%s\n' "${BUILD_TARGETS[@]}"

          echo "===== ARCHITECTURE ====="
          echo "aarch64"

          echo "===== INSTALL PREFIX ====="
          echo "/data/data/com.liangx/files/usr"

          echo "===== BUILD ALL TARGETS ====="

          ./build-package.sh \
            -a aarch64 \
            -j2 \
            -o "$GITHUB_WORKSPACE/debs" \
            "${BUILD_TARGETS[@]}"

          echo "===== BUILD FINISHED ====="
          df -h /

      # 9. 验证所有预期包
      - name: Verify generated DEB packages
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          DEBS=("$GITHUB_WORKSPACE"/debs/*.deb)

          if [ "${#DEBS[@]}" -eq 0 ]; then
            echo "ERROR: No DEB packages were generated."
            exit 1
          fi

          echo "===== GENERATED PACKAGES ====="

          : > "$GITHUB_WORKSPACE/debs/PACKAGE-MANIFEST.txt"

          for deb in "${DEBS[@]}"; do
            package="$(dpkg-deb -f "$deb" Package)"
            version="$(dpkg-deb -f "$deb" Version)"
            architecture="$(dpkg-deb -f "$deb" Architecture)"

            printf '%-30s %-25s %s\n' \
              "$package" "$version" "$architecture"

            printf '%s %s %s\n' \
              "$package" "$version" "$architecture" \
              >> "$GITHUB_WORKSPACE/debs/PACKAGE-MANIFEST.txt"
          done

          echo "===== VERIFY EXPECTED PACKAGES ====="

          while IFS= read -r required; do
            [ -n "$required" ] || continue

            found=false

            for deb in "${DEBS[@]}"; do
              package="$(dpkg-deb -f "$deb" Package)"

              if [ "$package" = "$required" ]; then
                found=true
                break
              fi
            done

            if [ "$found" != true ]; then
              echo "ERROR: Missing DEB package: $required"
              exit 1
            fi

            echo "OK: $required"

          done < "$GITHUB_WORKSPACE/expected-packages.txt"

          echo "===== VERIFY REQUIRED PACKAGES ====="

          for required in vim xxd diffutils; do
            if ! grep -q "^${required} " \
              "$GITHUB_WORKSPACE/debs/PACKAGE-MANIFEST.txt"; then
              echo "ERROR: Required package missing: $required"
              exit 1
            fi

            echo "OK: $required"
          done

          echo "===== VERIFY ARCHITECTURES ====="

          for deb in "${DEBS[@]}"; do
            architecture="$(dpkg-deb -f "$deb" Architecture)"

            case "$architecture" in
              aarch64|all)
                ;;
              *)
                echo "ERROR: Unexpected architecture:"
                echo "$deb"
                echo "$architecture"
                exit 1
                ;;
            esac
          done

          echo "All package architectures are valid."

          # Include build reports in the Artifact.
          cp "$GITHUB_WORKSPACE/build-targets.txt" \
            "$GITHUB_WORKSPACE/debs/"

          cp "$GITHUB_WORKSPACE/expected-packages.txt" \
            "$GITHUB_WORKSPACE/debs/"

          cp "$GITHUB_WORKSPACE/vim-build-order.txt" \
            "$GITHUB_WORKSPACE/debs/"

          cp "$GITHUB_WORKSPACE/diffutils-build-order.txt" \
            "$GITHUB_WORKSPACE/debs/"

          echo "===== GENERATE SHA256 ====="

          cd "$GITHUB_WORKSPACE/debs"
          sha256sum ./*.deb > SHA256SUMS.txt

          echo "===== TOTAL DEB COUNT ====="
          find . -maxdepth 1 -name '*.deb' | wc -l

          echo "===== ARTIFACT SIZE ====="
          du -sh "$GITHUB_WORKSPACE/debs"

          echo "===== DISK AFTER BUILD ====="
          df -h /

      # 10. 上传全部 DEB 和报告
      - name: Upload all DEB packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liangx-vim-aarch64-debs
          path: debs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
